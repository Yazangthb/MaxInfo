[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxinfo-vlm"
version = "0.1.0"
description = "Training-free keyframe selection (MaxInfo) utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "decord>=0.6.0",
  "torch",
  "transformers>=4.40",
  "accelerate>=0.28",
  "matplotlib>=3.7",
  "tqdm>=4.66",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["maxinfo*"]

